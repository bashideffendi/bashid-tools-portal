<script>
/* Posts are listed in /writing/posts.json: [{ "slug": "...", "title": "...", "date": "YYYY-MM-DD" }]
   Each post lives at /writing/<slug>/index.html (copy writing/_template.html). */
(async () => {
  let posts = [];
  try { posts = await (await fetch("/writing/posts.json", { cache: "no-cache" })).json(); } catch (e) {}
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = d => new Date(d + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  posts.sort((a, b) => b.date.localeCompare(a.date));
  document.getElementById("list").innerHTML = posts.map(p =>
    `<li><a href="/writing/${esc(p.slug)}/">${esc(p.title)}</a><p class="date"><time datetime="${esc(p.date)}">${fmt(p.date)}</time></p></li>`
  ).join("");
})();
</script>
