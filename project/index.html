<script>
/* Add a tool = add one object to items[]:
   { name, kind, desc, link, thumb?, status? }
   kind   : the small grey line (e.g. "Web app")
   status : "soon" = not live yet, not clickable (faded)
            "draft" = hidden
   link   : empty = plain row, not clickable (e.g. Claude skills)
   thumb  : /static/thumbs/<slug>.webp (320x200); empty = name box */
const PROJECTS = [
  {
    key: "audit", title: "Audit",
    items: [
      { name: "Tempe", kind: "Web app", desc: "Search BPK audit findings across reports and regions.", link: "https://tempe.masbash.id", thumb: "tempe" },
      { name: "Just Count", kind: "Web app", desc: "Audit construction consulting contracts and draft the BAPK.", link: "https://justcount.up.railway.app", thumb: "just-count" },
      { name: "PDDIKTI Checker", kind: "Web app", desc: "Check student status in PDDIKTI, in bulk.", link: "https://pddikti-checker.up.railway.app", thumb: "pddikti-checker" },
      { name: "SKA Checker", kind: "Web app", desc: "Verify construction expertise certificates with LPJK.", link: "https://cek-sertifikat-keahlian.up.railway.app", thumb: "ska-checker" },
      { name: "SIKD Browser", kind: "Web app", desc: "Regional budget data for every local government.", link: "https://sikd-browser.up.railway.app", thumb: "sikd-browser" },
      { name: "BPS Data Explorer", kind: "Web app", desc: "Official statistics from BPS.", link: "https://data-bps.up.railway.app/", thumb: "bps-data-explorer" },
      { name: "SIAP PKP Filler", kind: "Desktop app", desc: "Fill test results in SIAP BPK from a PKP spreadsheet.", link: "https://masbash.id/siap-pkp-filler.html", thumb: "siap-pkp-filler" },
      // draft: guide page siap-akun-filler.html + static/siap-akun-filler/ not pushed yet. Remove status to publish.
      { name: "SIAP Akun Filler", kind: "Bookmarklet", status: "draft", desc: "Fill SIAP BPK account modules in bulk from one spreadsheet.", link: "https://masbash.id/siap-akun-filler.html" },
      { name: "Kriteria", kind: "Web app", desc: "Find the regulations behind an audit finding.", link: "https://kriteria.masbash.id", thumb: "kriteria" },
      { name: "CalcTape Audit", kind: "Web app", desc: "Check the arithmetic in an audit report.", link: "https://calctape.vercel.app", thumb: "calctape" },
      { name: "Cap Cip Cup", kind: "Web app", desc: "Statistical sampling for SP2D audits.", link: "https://capcipcup.masbash.id" },
      { name: "Pegawai", kind: "Coming soon", status: "soon", desc: "Test civil servant data against personnel spending.", link: "", thumb: "pegawai" },
      { name: "INAPROC", kind: "Coming soon", status: "soon", desc: "Evaluate procurement bids from INAPROC data.", link: "", thumb: "inaproc" },
      { name: "Perjadin", kind: "Coming soon", status: "soon", desc: "Audit official travel claims.", link: "", thumb: "perjadin" }
    ]
  },
  {
    key: "hobby", title: "Hobby",
    items: [
      { name: "Tiny Hour Tales Inventory", kind: "Web app", desc: "A watch collection with stories and service notes.", link: "https://inventory.tinyhourtales.com", thumb: "tiny-hour-tales" },
      { name: "Seiko Almanac", kind: "Web app", desc: "Decode Seiko serial numbers, calibers and models.", link: "https://seiko.tinyhourtales.com", thumb: "seiko-almanac" },
      { name: "Persotoan", kind: "Web app", desc: "A map of soto across Indonesia.", link: "https://soto.masbash.id", thumb: "persotoan" },
      { name: "RABin", kind: "Web app", desc: "Construction cost estimates in the browser.", link: "https://rabindonesia.vercel.app", thumb: "rabin" },
      { name: "Hujan di Batam", kind: "Web app", desc: "Live rain radar for Batam.", link: "https://hujandibatam.masbash.id", thumb: "hujan-di-batam" },
      { name: "Batam Bites", kind: "Web app", desc: "Where to eat in Batam.", link: "https://batam-bites.vercel.app", thumb: "batam-bites" }
    ]
  },
  {
    key: "business", title: "Business",
    items: [
      { name: "Klunting", kind: "Web app", desc: "Net worth, cash flow and goals in one place.", link: "https://www.klunting.com", thumb: "klunting" },
      { name: "Investment Dashboard", kind: "Web app", desc: "Track stocks, mutual funds and bonds.", link: "https://kelolainvestasi.vercel.app", thumb: "investment-dashboard" }
    ]
  },
  {
    key: "skills", title: "Skills",
    items: [
      { name: "menulis-temuan-bpk", kind: "Claude skill", desc: "Writes BPK audit findings in the official style, ready for Word.", link: "" },
      { name: "data-scraper", kind: "Claude skill", desc: "Builds scrapers for public data that run for free.", link: "" },
      { name: "repo-scan", kind: "Claude skill", desc: "Checks an old repo for dead code, extra dependencies and leaked secrets.", link: "" },
      { name: "secret-scan", kind: "Claude skill", desc: "Catches leaked API keys before a push.", link: "" }
    ]
  }
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let n = 0;
function row(t) {
  const soon = t.status === "soon";
  const lazy = n++ >= 6 ? ' loading="lazy"' : "";
  const thumb = t.thumb
    ? `<div class="thumb"><img src="/static/thumbs/${esc(t.thumb)}.webp" width="320" height="200" alt=""${lazy} decoding="async"></div>`
    : `<div class="thumb blank" aria-hidden="true">${esc(t.name)}</div>`;
  const meta = `<div class="meta"><p class="t">${esc(t.name)}</p><p class="k">${esc(t.kind)}</p><p class="d">${esc(t.desc)}</p></div>`;
  if (soon) return `<li><div class="row soon">${thumb}${meta}</div></li>`;
  if (!t.link) return `<li><div class="row">${thumb}${meta}</div></li>`;
  return `<li><a class="row" href="${esc(t.link)}" target="_blank" rel="noopener">${thumb}${meta}</a></li>`;
}
document.getElementById("app").innerHTML = PROJECTS.map(g =>
  `<section class="group" id="${g.key}"><h2>${esc(g.title)}</h2><ul class="list">${g.items.filter(t => t.status !== "draft").map(row).join("")}</ul></section>`
).join("");

/* Touch screens can't hover: colour the single row closest to the middle of the viewport. */
if (window.matchMedia("(hover: none)").matches) {
  const rows = [...document.querySelectorAll(".list > li")];
  let raf = 0, cur = null;
  const pick = () => {
    raf = 0;
    const mid = innerHeight / 2;
    let best = null, bestD = Infinity;
    for (const li of rows) {
      const b = li.getBoundingClientRect();
      if (b.bottom < 0 || b.top > innerHeight) continue;
      const d = Math.abs((b.top + b.bottom) / 2 - mid);
      if (d < bestD) { bestD = d; best = li; }
    }
    if (best !== cur) { if (cur) cur.removeAttribute("data-active"); if (best) best.setAttribute("data-active", ""); cur = best; }
  };
  addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(pick); }, { passive: true });
  addEventListener("resize", pick);
  pick();
}
</script>
